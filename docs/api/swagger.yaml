basePath: /
definitions:
  handlers.itemRequest:
    properties:
      category_id:
        type: integer
      cost_price:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      min_stock:
        type: integer
      name:
        type: string
      selling_price:
        type: string
      sku:
        type: string
      unit:
        type: string
    type: object
  handlers.purchaseRequestLinePayload:
    properties:
      item_id:
        type: integer
      price:
        type: string
      qty:
        format: int64
        type: integer
    type: object
  handlers.purchaseRequestPayload:
    properties:
      branch_id:
        type: integer
      lines:
        items:
          $ref: '#/definitions/handlers.purchaseRequestLinePayload'
        type: array
      pr_date:
        type: string
      req_date:
        type: string
      supplier_id:
        type: integer
    type: object
  handlers.purchaseOrderLineInput:
    properties:
      item_id:
        type: integer
      price:
        type: string
      qty:
        format: int64
        type: integer
    type: object
  handlers.purchaseOrderPayload:
    properties:
      due_date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.purchaseOrderLineInput'
        type: array
      po_date:
        type: string
      ref_num:
        type: string
    type: object
  handlers.goodReceiptLineInput:
    properties:
      item_id:
        type: integer
      qty:
        format: int64
        type: integer
    type: object
  handlers.goodReceiptPayload:
    properties:
      gr_date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.goodReceiptLineInput'
        type: array
      po_number:
        type: string
    type: object
  handlers.stockAdjustmentLinePayload:
    properties:
      actual_qty:
        format: int64
        type: integer
      item_id:
        type: integer
    type: object
  handlers.stockAdjustmentPayload:
    properties:
      adjustment_date:
        type: string
      adjustment_type:
        enum:
        - opening_balance
        - adjustment
        type: string
      branch_id:
        type: integer
      lines:
        items:
          $ref: '#/definitions/handlers.stockAdjustmentLinePayload'
        type: array
      reason:
        type: string
        x-nullable: true
    type: object
  handlers.supplierRequest:
    properties:
      address:
        type: string
      code:
        type: string
      contact_person:
        type: string
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
    type: object
info:
  contact: {}
  description: ERP API untuk master item, supplier, purchasing, dan inventory. Endpoint
    /api memakai token Laravel POS.
  title: ERP API
  version: 1.0.0
paths:
  /api/good-receipts:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Search by GR, PO, supplier, or branch
        in: query
        name: search
        type: string
      - description: posted, draft, or cancelled
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List good receipts
      tags:
      - Good Receipts
    post:
      parameters:
      - description: Good receipt details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.goodReceiptPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Post a good receipt and add its quantities to branch stock
      tags:
      - Good Receipts
  /api/good-receipts/purchase-orders:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List purchase orders available for receipt
      tags:
      - Good Receipts
  /api/good-receipts/purchase-orders/{po_number}:
    get:
      parameters:
      - description: Purchase order number
        in: path
        name: po_number
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get remaining quantities for a purchase order
      tags:
      - Good Receipts
  /api/good-receipts/{id}:
    get:
      parameters:
      - description: Good receipt ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get good receipt details
      tags:
      - Good Receipts
  /api/stocks:
    get:
      parameters:
      - description: Branch ID
        in: query
        name: branch_id
        required: true
        type: integer
      - description: Item name or SKU
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List item stock balances for a branch
      tags:
      - Stock
  /api/stock-adjustments:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Branch ID
        in: query
        name: branch_id
        type: integer
      - description: draft, posted, or cancelled
        in: query
        name: status
        type: string
      - description: opening_balance or adjustment
        in: query
        name: adjustment_type
        type: string
      - description: Document number, branch, or reason
        in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List stock adjustments
      tags:
      - Stock Adjustments
    post:
      parameters:
      - description: Stock adjustment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockAdjustmentPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create stock adjustment draft
      tags:
      - Stock Adjustments
  /api/stock-adjustments/{id}:
    get:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get stock adjustment
      tags:
      - Stock Adjustments
    put:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Stock adjustment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockAdjustmentPayload'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update stock adjustment draft
      tags:
      - Stock Adjustments
  /api/stock-adjustments/{id}/cancel:
    patch:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel stock adjustment draft
      tags:
      - Stock Adjustments
  /api/stock-adjustments/{id}/post:
    post:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Post a stock adjustment
      tags:
      - Stock Adjustments
  /api/stocks/branches:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List branches for stock lookup
      tags:
      - Stock
  /api/stocks/{branch_id}/{item_id}/cards:
    get:
      parameters:
      - description: Branch ID
        in: path
        name: branch_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List stock movements for a branch item
      tags:
      - Stock
  /api/items:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Search name, SKU, or description
        in: query
        name: search
        type: string
      - description: active or inactive
        in: query
        name: status
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List items
      tags:
      - Items
    post:
      parameters:
      - description: Item details
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handlers.itemRequest'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create item
      tags:
      - Items
  /api/items/{id}:
    get:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get item
      tags:
      - Items
    put:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item details
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handlers.itemRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update item
      tags:
      - Items
  /api/items/{id}/status:
    patch:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status payload with is_active
        in: body
        name: status
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set item status
      tags:
      - Items
  /api/items/categories:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List item categories
      tags:
      - Items
  /api/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /api/purchase-orders:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: PO number, source PR number, supplier, or branch
        in: query
        name: search
        type: string
      - description: draft, ordered, partially_received, received, or cancelled
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List purchase orders
      tags:
      - Purchase Orders
    post:
      parameters:
      - description: Purchase order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.purchaseOrderPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create purchase order from one PR
      tags:
      - Purchase Orders
  /api/purchase-orders/purchase-requests:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List PRs with remaining order quantities
      tags:
      - Purchase Orders
  /api/purchase-orders/purchase-requests/{pr_number}:
    get:
      parameters:
      - description: Source purchase request number
        in: path
        name: pr_number
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get PR lines with remaining quantities
      tags:
      - Purchase Orders
  /api/purchase-orders/{id}:
    get:
      parameters:
      - description: Purchase order ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get purchase order
      tags:
      - Purchase Orders
  /api/purchase-orders/{id}/cancel:
    patch:
      parameters:
      - description: Purchase order ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel purchase order
      tags:
      - Purchase Orders
  /api/purchase-requests:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: PR number, branch, or requester
        in: query
        name: search
        type: string
      - description: Branch ID
        in: query
        name: branch_id
        type: integer
      - description: open, partially_ordered, ordered, or cancelled
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List purchase requests
      tags:
      - Purchase Requests
    post:
      parameters:
      - description: Purchase request details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.purchaseRequestPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create purchase request
      tags:
      - Purchase Requests
  /api/purchase-requests/{id}:
    get:
      parameters:
      - description: Purchase request ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get purchase request
      tags:
      - Purchase Requests
    put:
      parameters:
      - description: Purchase request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Purchase request details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.purchaseRequestPayload'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update purchase request
      tags:
      - Purchase Requests
  /api/purchase-requests/{id}/cancel:
    patch:
      parameters:
      - description: Purchase request ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel purchase request
      tags:
      - Purchase Requests
  /api/purchase-requests/branches:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List request branches
      tags:
      - Purchase Requests
  /api/purchase-requests/suppliers:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List request suppliers
      tags:
      - Purchase Requests
  /api/suppliers:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List suppliers
      tags:
      - Suppliers
    post:
      parameters:
      - description: Supplier details
        in: body
        name: supplier
        required: true
        schema:
          $ref: '#/definitions/handlers.supplierRequest'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create supplier
      tags:
      - Suppliers
  /api/suppliers/{id}:
    delete:
      parameters:
      - description: Supplier ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete supplier
      tags:
      - Suppliers
    get:
      parameters:
      - description: Supplier ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get supplier
      tags:
      - Suppliers
    put:
      parameters:
      - description: Supplier ID
        in: path
        name: id
        required: true
        type: integer
      - description: Supplier details
        in: body
        name: supplier
        required: true
        schema:
          $ref: '#/definitions/handlers.supplierRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update supplier
      tags:
      - Suppliers
securityDefinitions:
  BearerAuth:
    description: 'Gunakan format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
