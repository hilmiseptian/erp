basePath: /
definitions:
  handlers.itemRequest:
    properties:
      category_id:
        type: integer
      cost_price:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      min_stock:
        type: integer
      name:
        type: string
      selling_price:
        type: string
      sku:
        type: string
      unit:
        type: string
    type: object
  handlers.purchaseRequestLinePayload:
    properties:
      item_id:
        type: integer
      price:
        type: string
      qty:
        format: int64
        type: integer
    type: object
  handlers.purchaseRequestPayload:
    properties:
      branch_id:
        type: integer
      lines:
        items:
          $ref: '#/definitions/handlers.purchaseRequestLinePayload'
        type: array
      pr_date:
        type: string
      req_date:
        type: string
      supplier_id:
        type: integer
    type: object
  handlers.purchaseOrderLineInput:
    properties:
      item_id:
        type: integer
      price:
        type: string
      qty:
        format: int64
        type: integer
    type: object
  handlers.purchaseOrderPayload:
    properties:
      due_date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.purchaseOrderLineInput'
        type: array
      po_date:
        type: string
      ref_num:
        type: string
    type: object
  handlers.goodReceiptLineInput:
    properties:
      item_id:
        type: integer
      qty:
        format: int64
        type: integer
    type: object
  handlers.goodReceiptPayload:
    properties:
      gr_date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.goodReceiptLineInput'
        type: array
      po_number:
        type: string
    type: object
  handlers.stockAdjustmentLinePayload:
    properties:
      actual_qty:
        format: int64
        type: integer
      item_id:
        type: integer
    type: object
  handlers.stockAdjustmentPayload:
    properties:
      adjustment_date:
        type: string
      adjustment_type:
        enum:
        - opening_balance
        - adjustment
        type: string
      branch_id:
        type: integer
      lines:
        items:
          $ref: '#/definitions/handlers.stockAdjustmentLinePayload'
        type: array
      reason:
        type: string
        x-nullable: true
    type: object
  handlers.supplierRequest:
    properties:
      address:
        type: string
      code:
        type: string
      contact_person:
        type: string
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
    type: object
  handlers.customerPayload:
    properties:
      billing_address:
        type: string
        x-nullable: true
      contact_person:
        type: string
        x-nullable: true
      customer_code:
        type: string
      email:
        type: string
        x-nullable: true
      name:
        type: string
      phone:
        type: string
        x-nullable: true
      shipping_address:
        type: string
        x-nullable: true
      tax_number:
        type: string
        x-nullable: true
    required:
    - customer_code
    - name
    type: object
  handlers.salesOrderLinePayload:
    properties:
      discount_amount:
        type: string
      id:
        format: int64
        type: integer
      item_id:
        format: int64
        type: integer
      notes:
        type: string
        x-nullable: true
      qty:
        format: int64
        type: integer
    required:
    - item_id
    - qty
    type: object
  handlers.salesOrderPayload:
    properties:
      branch_id:
        format: int64
        type: integer
      customer_id:
        format: int64
        type: integer
      delivery_address:
        type: string
        x-nullable: true
      delivery_date:
        type: string
        x-nullable: true
      discount_amount:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.salesOrderLinePayload'
        type: array
      notes:
        type: string
        x-nullable: true
      so_date:
        type: string
    required:
    - branch_id
    - customer_id
    - so_date
    - lines
    type: object
  handlers.customerStatusPayload:
    properties:
      is_active:
        type: boolean
    required:
    - is_active
    type: object
  handlers.goodDeliveryLineInput:
    properties:
      item_id:
        format: int64
        type: integer
      qty:
        format: int64
        type: integer
    required:
    - item_id
    - qty
    type: object
  handlers.goodDeliveryPayload:
    properties:
      gd_date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.goodDeliveryLineInput'
        type: array
      ref_num:
        type: string
      ref_type:
        enum:
        - sales_order
        type: string
    required:
    - ref_type
    - ref_num
    - gd_date
    - lines
    type: object
  handlers.stockTransferLinePayload:
    properties:
      item_id:
        format: int64
        type: integer
      qty:
        format: int64
        type: integer
    required:
    - item_id
    - qty
    type: object
  handlers.stockTransferPayload:
    properties:
      from_branch_id:
        format: int64
        type: integer
      to_branch_id:
        format: int64
        type: integer
      transfer_date:
        type: string
      notes:
        type: string
        x-nullable: true
      lines:
        items:
          $ref: '#/definitions/handlers.stockTransferLinePayload'
        type: array
    required:
    - from_branch_id
    - to_branch_id
    - transfer_date
    - lines
    type: object
  handlers.stockTransferMovementPayload:
    properties:
      gd_header_id:
        format: int64
        type: integer
      date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.stockTransferLinePayload'
        type: array
    required:
    - date
    - lines
    type: object
  handlers.stockTransferReceiptPayload:
    properties:
      gd_header_id:
        format: int64
        type: integer
      date:
        type: string
      lines:
        items:
          $ref: '#/definitions/handlers.stockTransferLinePayload'
        type: array
    required:
    - gd_header_id
    - date
    - lines
    type: object
info:
  contact: {}
  description: ERP API for master items, customers, purchasing, inventory, and B2B sales orders. Routes under /api validate the Laravel POS token.
  title: ERP API
  version: 1.0.0
paths:
  /api/good-deliveries:
    get:
      parameters:
      - description: GD number, source number, or branch
        in: query
        name: search
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: limit
        type: integer
      responses:
        "200":
          description: Posted goods deliveries
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List goods deliveries
      tags:
      - Goods Deliveries
    post:
      parameters:
      - in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.goodDeliveryPayload'
      responses:
        "201":
          description: Goods delivery posted and stock updated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Post a goods delivery
      tags:
      - Goods Deliveries
  /api/good-deliveries/sources:
    get:
      parameters:
      - description: Currently sales_order
        in: query
        name: ref_type
        required: true
        type: string
      responses:
        "200":
          description: Available source documents
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List goods delivery sources
      tags:
      - Goods Deliveries
  /api/good-deliveries/sources/{ref_type}/{ref_num}:
    get:
      parameters:
      - description: Currently sales_order
        in: path
        name: ref_type
        required: true
        type: string
      - description: Source document number
        in: path
        name: ref_num
        required: true
        type: string
      responses:
        "200":
          description: Remaining quantities by item
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get remaining source quantities
      tags:
      - Goods Deliveries
  /api/good-deliveries/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Goods delivery and detail lines
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get goods delivery details
      tags:
      - Goods Deliveries
  /api/customers:
    get:
      parameters:
      - description: Search by customer code, name, tax number, or contact
        in: query
        name: search
        type: string
      - description: active or inactive
        in: query
        name: status
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: limit
        type: integer
      responses:
        "200":
          description: Customer list
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List company customers
      tags:
      - Customers
    post:
      parameters:
      - in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/handlers.customerPayload'
      responses:
        "201":
          description: Customer created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create customer
      tags:
      - Customers
  /api/customers/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Customer detail
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get customer
      tags:
      - Customers
    put:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      - in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/handlers.customerPayload'
      responses:
        "200":
          description: Customer updated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update customer
      tags:
      - Customers
  /api/customers/{id}/status:
    patch:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      - in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/handlers.customerStatusPayload'
      responses:
        "200":
          description: Customer status updated
      security:
      - BearerAuth: []
      summary: Activate or deactivate customer
      tags:
      - Customers
  /api/sales-orders:
    get:
      parameters:
      - description: Search by SO number, customer, or branch
        in: query
        name: search
        type: string
      - description: open, partially_delivered, delivered, or cancelled
        in: query
        name: status
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: limit
        type: integer
      responses:
        "200":
          description: Sales order list
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List sales orders
      tags:
      - Sales Orders
    post:
      parameters:
      - in: body
        name: salesOrder
        required: true
        schema:
          $ref: '#/definitions/handlers.salesOrderPayload'
      responses:
        "201":
          description: Sales order created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create sales order
      tags:
      - Sales Orders
  /api/sales-orders/branches:
    get:
      responses:
        "200":
          description: Branches for the authenticated company
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List sales order branches
      tags:
      - Sales Orders
  /api/sales-orders/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Sales order detail
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get sales order
      tags:
      - Sales Orders
    put:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      - in: body
        name: salesOrder
        required: true
        schema:
          $ref: '#/definitions/handlers.salesOrderPayload'
      responses:
        "200":
          description: Sales order updated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an open sales order
      tags:
      - Sales Orders
  /api/sales-orders/{id}/cancel:
    patch:
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Sales order cancelled
      security:
      - BearerAuth: []
      summary: Cancel sales order
      tags:
      - Sales Orders
  /api/good-receipts:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Search by GR, PO, supplier, or branch
        in: query
        name: search
        type: string
      - description: posted, draft, or cancelled
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List good receipts
      tags:
      - Good Receipts
    post:
      parameters:
      - description: Good receipt details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.goodReceiptPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Post a good receipt and add its quantities to branch stock
      tags:
      - Good Receipts
  /api/good-receipts/purchase-orders:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List purchase orders available for receipt
      tags:
      - Good Receipts
  /api/good-receipts/purchase-orders/{po_number}:
    get:
      parameters:
      - description: Purchase order number
        in: path
        name: po_number
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get remaining quantities for a purchase order
      tags:
      - Good Receipts
  /api/good-receipts/{id}:
    get:
      parameters:
      - description: Good receipt ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get good receipt details
      tags:
      - Good Receipts
  /api/stocks:
    get:
      parameters:
      - description: Branch ID
        in: query
        name: branch_id
        required: true
        type: integer
      - description: Item name or SKU
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List item stock balances for a branch
      tags:
      - Stock
  /api/stock-adjustments:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Branch ID
        in: query
        name: branch_id
        type: integer
      - description: draft, posted, or cancelled
        in: query
        name: status
        type: string
      - description: opening_balance or adjustment
        in: query
        name: adjustment_type
        type: string
      - description: Document number, branch, or reason
        in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List stock adjustments
      tags:
      - Stock Adjustments
    post:
      parameters:
      - description: Stock adjustment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockAdjustmentPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create stock adjustment draft
      tags:
      - Stock Adjustments
  /api/stock-adjustments/{id}:
    get:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get stock adjustment
      tags:
      - Stock Adjustments
    put:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Stock adjustment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockAdjustmentPayload'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update stock adjustment draft
      tags:
      - Stock Adjustments
  /api/stock-adjustments/{id}/cancel:
    patch:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel stock adjustment draft
      tags:
      - Stock Adjustments
  /api/stock-adjustments/{id}/post:
    post:
      parameters:
      - description: Stock adjustment ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Post a stock adjustment
      tags:
      - Stock Adjustments
  /api/stock-transfers:
    get:
      parameters:
      - description: draft, in_progress, completed, or cancelled
        in: query
        name: status
        type: string
      - description: Transfer number or branch name
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List stock transfers
      tags:
      - Stock Transfers
    post:
      parameters:
      - description: Stock transfer details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockTransferPayload'
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a stock transfer draft
      tags:
      - Stock Transfers
  /api/stock-transfers/branches:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List branches available for stock transfer
      tags:
      - Stock Transfers
  /api/stock-transfers/items:
    get:
      parameters:
      - description: Source branch ID
        in: query
        name: branch_id
        required: true
        type: integer
      - description: Item SKU or name
        in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List stocked items for a source branch
      tags:
      - Stock Transfers
  /api/stock-transfers/{id}:
    get:
      parameters:
      - description: Stock transfer ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get stock transfer and movement quantities
      tags:
      - Stock Transfers
    put:
      parameters:
      - description: Stock transfer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Stock transfer details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockTransferPayload'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a stock transfer draft
      tags:
      - Stock Transfers
  /api/stock-transfers/{id}/cancel:
    patch:
      parameters:
      - description: Stock transfer ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a stock transfer draft
      tags:
      - Stock Transfers
  /api/stock-transfers/{id}/dispatches:
    post:
      parameters:
      - description: Stock transfer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Dispatch quantities
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockTransferMovementPayload'
      responses:
        "201":
          description: Dispatch posted
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dispatch part of a stock transfer
      tags:
      - Stock Transfers
  /api/stock-transfers/{id}/receipts:
    post:
      parameters:
      - description: Stock transfer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Receipt quantities and dispatched GD
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.stockTransferReceiptPayload'
      responses:
        "201":
          description: Receipt posted
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Receive part of a stock transfer
      tags:
      - Stock Transfers
  /api/stocks/branches:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List branches for stock lookup
      tags:
      - Stock
  /api/stocks/{branch_id}/{item_id}/cards:
    get:
      parameters:
      - description: Branch ID
        in: path
        name: branch_id
        required: true
        type: integer
      - description: Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
